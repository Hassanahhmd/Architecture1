<!doctype html>
<html lang="ar" dir="rtl">
<head>
<title>Lasheen Villa Tour</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
:root{--ink:#f6efe4;--panel:rgba(30,23,18,.72);--line:rgba(217,185,140,.28);--gold:#d9b98c;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#191411;color:var(--ink);font:14px/1.5 "IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;outline:0}#c:active{cursor:grabbing}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:999px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#brand{position:fixed;top:calc(14px + env(safe-area-inset-top));inset-inline-start:16px;padding:10px 18px;border-radius:14px;pointer-events:none}
#brand b{display:block;font:600 19px/1.3 "Cormorant Garamond",Georgia,serif;letter-spacing:.04em;color:var(--gold);direction:ltr}
#brand span{font-size:12px;opacity:.85}
#tools{position:fixed;top:calc(14px + env(safe-area-inset-top));inset-inline-end:16px;display:flex;gap:4px;padding:5px;border-radius:999px}
#tools button{padding:5px 13px;font-size:13px}#tools button:hover,#bar button:hover{background:rgba(217,185,140,.16)}
button.on,#bar button.on:hover{background:var(--gold);color:#241a12;font-weight:600}
#dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
#bar{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:7px;border-radius:22px;max-width:980px;pointer-events:auto}
#bar button{padding:6px 14px;font-size:13px}
#hint{font-size:12.5px;padding:5px 14px;border-radius:999px;text-align:center;transition:opacity .6s}#hint.gone{opacity:0}
#map{position:fixed;inset-inline-end:16px;top:calc(72px + env(safe-area-inset-top));width:150px;height:156px;border-radius:14px;cursor:pointer;display:none}
.walking #map{display:block}
#stick{position:fixed;left:20px;bottom:calc(120px + env(safe-area-inset-bottom));width:104px;height:104px;border-radius:50%;display:none;touch-action:none}
#knob{position:absolute;left:31px;top:31px;width:40px;height:40px;border-radius:50%;background:var(--gold);opacity:.9;pointer-events:none}
@media(pointer:coarse){.walking #stick{display:block}}
#labels{position:fixed;inset:0;pointer-events:none}
#labels button{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:3px 6px;direction:rtl;background:var(--panel);border-color:var(--line);font-size:12px}
#labels b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#241a12;font-size:11px}
#loader{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:14px;background:#191411;transition:opacity .8s;padding:24px;z-index:9}#loader.gone{opacity:0;pointer-events:none}
#loader b{font:600 30px/1.2 "Cormorant Garamond",Georgia,serif;color:var(--gold)}
#loader i{width:140px;height:2px;margin:auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:p 1.2s ease-in-out infinite alternate}@keyframes p{from{opacity:.2;transform:scaleX(.4)}to{opacity:1}}
.hero{border-color:var(--line)!important;color:var(--gold)}.hero.on{color:#241a12}
.line{border-color:var(--line);padding:6px 12px;font-size:12.5px}.line:hover{background:rgba(217,185,140,.16)}
.row{display:flex;flex-wrap:wrap;gap:6px}
#panel{position:fixed;z-index:5;inset-inline-start:16px;top:calc(96px + env(safe-area-inset-top));width:310px;max-height:calc(100% - 232px);overflow:auto;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;background:rgba(28,21,16,.9)}
#panel header,#vfb header{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--gold)}
#collections{display:flex;flex-wrap:wrap;gap:6px}#collections button{border-color:var(--line);padding:4px 11px;font-size:12.5px}
fieldset{border:0;min-width:0}legend{font-size:12px;opacity:.75;margin-bottom:5px}legend em{font-style:normal;color:var(--gold)}
.sw{display:flex;gap:9px}.sw button{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.18)}.sw button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
#split{position:fixed;inset:0;pointer-events:none;z-index:2}
#handle{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;pointer-events:auto;cursor:ew-resize;touch-action:none;display:flex;align-items:center;justify-content:center;color:#241a12}
#handle::before{content:"";position:absolute;top:0;bottom:0;left:-18px;right:-18px}
#handle{font-size:0}#handle::after{content:"⇔";font-size:18px;background:#fff;border-radius:50%;width:40px;height:40px;flex:none;display:grid;place-items:center}
#split span{position:absolute;top:44%;padding:4px 12px;border-radius:999px;font-size:12px;white-space:nowrap}
#studio{position:fixed;inset:0;z-index:6;pointer-events:none}
#vfb{position:absolute;pointer-events:auto;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:320px;max-width:calc(100% - 32px);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:9px;background:rgba(28,21,16,.88)}
#count{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink)}#track{height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;direction:ltr}#fill{display:block;height:100%;width:0;background:var(--gold)}
#snote{font-size:12px;opacity:.75}#vfb label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px}
select{font:inherit;background:#2a201a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px 8px;direction:ltr}input[type=range]{accent-color:var(--gold);width:160px}
#vfb .row button{padding:6px 14px;font-size:12.5px}
#toast{position:fixed;z-index:8;left:50%;transform:translateX(-50%);top:46%;padding:10px 20px;border-radius:14px;background:rgba(28,21,16,.92);max-width:calc(100% - 32px);text-align:center}
body.studio #dock,body.studio #tools,body.studio #map,body.studio #stick,body.studio #labels{display:none!important}
.glass.on,button.on{background:var(--gold);color:#241a12}
#tools{flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 300px);border-radius:22px}
#gate{position:fixed;inset:0;z-index:7;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(ellipse at center,rgba(15,10,8,.78),rgba(15,10,8,.4) 75%);transition:opacity .7s,visibility .7s}
body:has(#gate:not(.gone)) :is(#tools,#dock,#brand,#map,#stick){visibility:hidden}
#gate.gone{opacity:0;visibility:hidden;pointer-events:none}#gate>div{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%}
#gate b{font:600 clamp(30px,6vw,58px)/1.15 "Cormorant Garamond",Georgia,serif;color:var(--gold);letter-spacing:.03em;direction:ltr}
#gate p{font-size:clamp(15px,2.4vw,21px);margin-bottom:12px;text-wrap:balance}
#gate button{padding:11px 30px;font-size:15px}#gate #glang{font-size:12.5px;opacity:.75;padding:4px 14px}
#menu{position:fixed;z-index:5;top:calc(110px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:320px;max-width:calc(100% - 32px);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:9px;background:rgba(28,21,16,.94)}
#menu header{display:flex;justify-content:space-between;color:var(--gold)}#menu>button{padding:9px}#mnote{font-size:12px;opacity:.7}
#film{position:fixed;inset:0;z-index:6}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.lb{position:absolute;left:0;right:0;height:7.5%;background:#000;pointer-events:none;animation:lb 1s ease both}.lb.top{top:0}.lb.bot{bottom:0}@keyframes lb{from{height:0}}
#captions{position:absolute;left:0;right:0;bottom:12%;text-align:center;padding:0 20px;pointer-events:none;text-shadow:0 2px 18px rgba(0,0,0,.85)}
#cap{font-size:clamp(20px,3.6vw,40px);font-weight:600;text-wrap:balance}#cap2{white-space:pre-line;font:600 clamp(13px,1.8vw,20px)/1.6 "Cormorant Garamond","IBM Plex Sans Arabic",serif;color:var(--gold);letter-spacing:.06em}
#captions::before{content:"";position:absolute;z-index:-1;inset:-40px 0;background:radial-gradient(ellipse 42% 60% at center,rgba(0,0,0,.5),transparent 75%)}
#film.final #captions{bottom:66%}#film.final #cap{font:600 clamp(32px,6vw,68px)/1.2 "Cormorant Garamond",Georgia,serif;color:var(--gold);direction:ltr}#film.final #cap2{color:var(--ink)}
#ctrl{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline-end:14px;display:flex;gap:6px;align-items:center}#ctrl button{padding:5px 13px;font-size:12.5px;border:1px solid var(--line)}
#recdot{display:none;align-items:center;gap:6px;font-size:12px}#recdot i{width:9px;height:9px;border-radius:50%;background:#ff4b3e}.recording #recdot{display:flex}
.recording #c{object-fit:contain;background:#000}.recording .lb,.recording #captions,.recording #fade{visibility:hidden}
#progress{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}
#end{position:absolute;left:0;right:0;bottom:13%;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:0 16px}#end>*{padding:10px 22px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none}#end>.on{color:#241a12}#end>#econtact{background:#25d366;border-color:#25d366;color:#06210f;font-weight:600}
#wa{flex:none;display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;background:#25d366;color:#06210f;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}@media(max-width:720px){#wa{font-size:12px;padding:4px 9px}}
body.cinema #dock,body.cinema #tools,body.cinema #map,body.cinema #stick,body.cinema #labels,body.cinema #brand,body.cinema #toast:empty{display:none!important}
#rsplit{position:fixed;inset:0;pointer-events:none;z-index:2}#rhandle{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--gold);pointer-events:auto;cursor:ew-resize;touch-action:none}
#rhandle::before{content:"";position:absolute;top:0;bottom:0;left:-20px;right:-20px}#rhandle::after{content:"⇔";position:absolute;top:50%;left:-19px;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#241a12;display:grid;place-items:center;font-size:18px}
#reveal{position:fixed;z-index:4;left:0;right:0;bottom:calc(122px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 10px}
#stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}#stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 16px;text-align:center}#stats b{display:block;color:var(--gold);font-size:19px;font-variant-numeric:tabular-nums;direction:ltr}#stats span{font-size:11.5px;opacity:.8}
.seg{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;align-items:center;padding:5px 10px;border-radius:22px;pointer-events:auto;direction:ltr}.seg button{padding:4px 13px;font-size:12.5px}.seg span{font-size:12px;color:var(--gold);padding:0 6px}
body.revealing #stick,body.revealing #hint{display:none!important}
@media(min-width:721px) and (max-width:1180px){#map{top:calc(96px + env(safe-area-inset-top))}}
@media(max-width:720px){
 #reveal{bottom:calc(112px + env(safe-area-inset-bottom))}.seg span{display:none}#stats div{padding:4px 10px}#stats b{font-size:15px}#menu{top:90px}
 #panel{inset-inline:10px;width:auto;top:auto;bottom:calc(110px + env(safe-area-inset-bottom));max-height:42%}
 body.designing #map,body.designing #stick,body.designing #hint{display:none!important}
 #brand{padding:7px 12px}#brand b{font-size:15px}#brand span{font-size:10.5px}
 #tools{top:auto;bottom:calc(66px + env(safe-area-inset-bottom));inset-inline:16px;justify-content:center;width:max-content;margin-inline:auto}#tools button{font-size:12px;padding:4px 9px}
 #bar{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;max-width:100%;border-radius:999px;scrollbar-width:none}#bar::-webkit-scrollbar{display:none}
 #dock{bottom:calc(10px + env(safe-area-inset-bottom))}#hint{position:fixed;bottom:112px;margin:0 16px;font-size:11.5px}
 #tools{flex-wrap:nowrap;border-radius:999px;max-width:calc(100% - 20px);overflow-x:auto;justify-content:flex-start;scrollbar-width:none}#tools button{flex:none}#brand{inset-inline-start:auto;inset-inline-end:10px}
 #map{width:104px;height:108px;top:calc(70px + env(safe-area-inset-top))}#stick{bottom:calc(120px + env(safe-area-inset-bottom))}#labels span{display:none}
}
</style>

<body>
<canvas id="c" aria-label="3D villa tour"></canvas>
<div id="labels" hidden></div>
<div id="brand" class="glass"><b>Eng Hassan Lasheen</b><span id="sub"></span></div>
<div id="tools" class="glass"><a id="wa" target="_blank" rel="noopener"></a><button id="filmbtn" class="hero"></button><button id="revealbtn" class="hero"></button><button id="render" class="hero"></button><button id="atelier" class="hero"></button><button id="auto"></button><button id="time"></button><button id="lang"></button><button id="full"></button></div>
<canvas id="map" class="glass" width="300" height="312"></canvas>
<div id="stick" class="glass"><div id="knob"></div></div>
<div id="dock"><div id="hint" class="glass"></div><nav id="bar" class="glass"></nav></div>

<section id="studio" hidden>
 <div class="glass" id="vfb"><header><b id="stitle"></b><span id="count" dir="ltr"></span></header><div id="track"><i id="fill"></i></div>
  <p id="snote"></p>
  <label><span id="lres"></span><select id="res"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4× Ultra</option></select></label>
  <label><span id="lq"></span><select id="quality"><option value="64">64</option><option value="256" selected>256</option><option value="1024">1024</option></select></label>
  <label><span id="lexp"></span><input id="exposure" type="range" min="40" max="220" value="100"></label>
  <div class="row"><button id="save" class="on"></button><button id="snap" class="line"></button><button id="sclose" class="line"></button></div>
 </div></section>
<div id="menu" class="glass" hidden><header><b id="mtitle"></b><button id="mclose" aria-label="Close">✕</button></header><button id="mplay" class="on"></button><button id="mwide" class="line"></button><button id="mtall" class="line"></button><p id="mnote"></p></div>
<section id="film" hidden><div id="fade"></div><div class="lb top"></div><div class="lb bot"></div>
 <div id="captions" aria-live="polite"><div id="cap"></div><div id="cap2"></div></div>
 <div id="ctrl"><span id="recdot"><i></i><span id="reclabel"></span></span><button id="mute" class="glass"></button><button id="skip" class="glass"></button></div>
 <div id="progress"></div>
 <div id="end" hidden><a id="econtact" class="on" target="_blank" rel="noopener"></a><button id="eexplore" class="glass"></button><button id="edesign" class="glass"></button><button id="eagain" class="glass"></button></div></section>
<div id="rsplit" hidden><div id="rhandle" role="slider" tabindex="0" aria-label="compare model"></div></div>
<div id="reveal" hidden><div id="stats"></div><div class="glass seg"><span id="ra"></span><button id="rwire"></button><button id="rclay"></button><button id="rexit" class="line"></button><span id="rb"></span></div></div>
<div id="gate"><div><b>Eng Hassan Lasheen</b><p id="gline"></p><button id="premiere" class="on"></button><button id="enter" class="line"></button><button id="glang"></button></div></div>
<div id="toast" class="glass" role="status" hidden></div>

// A stack of uint32 indices can can store the indices for
// a perfectly balanced tree with a depth up to 31. Lower stack
// depth gets higher performance.
//
// However not all trees are balanced. Best value to set this to
// is the trees max depth.
#ifndef BVH_STACK_DEPTH
#define BVH_STACK_DEPTH 60
#endif

#ifndef INFINITY
#define INFINITY 1e20
#endif

// Utilities
uvec4 uTexelFetch1D( usampler2D tex, uint index ) {

	uint width = uint( textureSize( tex, 0 ).x );
	uvec2 uv;
	uv.x = index % width;
	uv.y = index / width;

	return texelFetch( tex, ivec2( uv ), 0 );

}

ivec4 iTexelFetch1D( isampler2D tex, uint index ) {

	uint width = uint( textureSize( tex, 0 ).x );
	uvec2 uv;
	uv.x = index % width;
	uv.y = index / width;

	return texelFetch( tex, ivec2( uv ), 0 );

}

vec4 texelFetch1D( sampler2D tex, uint index ) {

	uint width = uint( textureSize( tex, 0 ).x );
	uvec2 uv;
	uv.x = index % width;
	uv.y = index / width;

	return texelFetch( tex, ivec2( uv ), 0 );

}

vec4 textureSampleBarycoord( sampler2D tex, vec3 barycoord, uvec3 faceIndices ) {

	return
		barycoord.x * texelFetch1D( tex, faceIndices.x ) +
		barycoord.y * texelFetch1D( tex, faceIndices.y ) +
		barycoord.z * texelFetch1D( tex, faceIndices.z );

}

void ndcToCameraRay(
	vec2 coord, mat4 cameraWorld, mat4 invProjectionMatrix,
	out vec3 rayOrigin, out vec3 rayDirection
) {

	// get camera look direction and near plane for camera clipping
	vec4 lookDirection = cameraWorld * vec4( 0.0, 0.0, - 1.0, 0.0 );
	vec4 nearVector = invProjectionMatrix * vec4( 0.0, 0.0, - 1.0, 1.0 );
	float near = abs( nearVector.z / nearVector.w );

	// get the camera direction and position from camera matrices
	vec4 origin = cameraWorld * vec4( 0.0, 0.0, 0.0, 1.0 );
	vec4 direction = invProjectionMatrix * vec4( coord, 0.5, 1.0 );
	direction /= direction.w;
	direction = cameraWorld * direction - origin;

	// slide the origin along the ray until it sits at the near clip plane position
	origin.xyz += direction.xyz * near / dot( direction, lookDirection );

	rayOrigin = origin.xyz;
	rayDirection = direction.xyz;

	// gets the pdf of the given direction to sample
	float equirectDirectionPdf( vec3 direction ) {

		vec2 uv = equirectDirectionToUv( direction );

	// samples the color given env map with CDF and returns the pdf of the direction

		vec3 randomPos = light.position - normal * startDistance + u * x + v * y;

			result = randomSpotLightSample( light, iesProfiles, rayOrigin, ruv.yz );

			vec3 lightRay = light.u - rayOrigin;

			rec.direction = normalize( lightRay );
			rec.dist = length( lightRay );
			rec.pdf = 1.0;
			rec.emission = light.color * light.intensity * distanceFalloff;
			rec.type = light.type;

			rec.direction = light.u;
			rec.pdf = 1.0;

			result = randomAreaLightSample( light, rayOrigin, ruv.yz );

	vec3 sampleHemisphere( vec3 n, vec2 uv ) {

		// https://www.rorydriscoll.com/2009/01/07/better-sampling/
		// https://graphics.pixar.com/library/OrthonormalB/paper.pdf
		float sign = n.z == 0.0 ? 1.0 : sign( n.z );
		float a = - 1.0 / ( sign + n.z );
		float b = n.x * n.y * a;
		vec3 b1 = vec3( 1.0 + sign * n.x * n.x * a, sign * b, - sign * n.x );
		vec3 b2 = vec3( b, sign + n.y * n.y * a, - n.y );

		float r = sqrt( uv.x );
		float theta = 2.0 * PI * uv.y;
		float x = r * cos( theta );
		float y = r * sin( theta );
		return x * b1 + y * b2 + sqrt( 1.0 - uv.x ) * n;

	}

		// center of the parallelogram

		if ( r.x + r.y > 1.0 ) {

	// Finds the point where the ray intersects the plane defined by u and v and checks if this point
	// falls in the bounds of the rectangle on that same plane.
	// Plane intersection: https://lousodrome.net/blog/light/2020/07/03/intersection-of-a-ray-and-a-plane/
	bool intersectsRectangle( vec3 center, vec3 normal, vec3 u, vec3 v, vec3 rayOrigin, vec3 rayDirection, inout float dist ) {

		float t = dot( center - rayOrigin, normal ) / dot( rayDirection, normal );

		if ( t > EPSILON ) {

			vec3 p = rayOrigin + rayDirection * t;
			vec3 vi = p - center;

			// check if p falls inside the rectangle
			float a1 = dot( u, vi );
			if ( abs( a1 ) <= 0.5 ) {

				float a2 = dot( v, vi );
				if ( abs( a2 ) <= 0.5 ) {

					dist = t;
					return true;

				}

			}

		}

		return false;

	}

	// Finds the point where the ray intersects the plane defined by u and v and checks if this point
	// falls in the bounds of the circle on that same plane. See above URL for a description of the plane intersection algorithm.
	bool intersectsCircle( vec3 position, vec3 normal, vec3 u, vec3 v, vec3 rayOrigin, vec3 rayDirection, inout float dist ) {

		float t = dot( position - rayOrigin, normal ) / dot( rayDirection, normal );

		if ( t > EPSILON ) {

			vec3 hit = rayOrigin + rayDirection * t;
			vec3 vi = hit - position;

			float a1 = dot( u, vi );
			float a2 = dot( v, vi );

			if( length( vec2( a1, a2 ) ) <= 0.5 ) {

				dist = t;
				return true;

			}

		}

		return false;

	}

		// float F = disneyFresnel( wo, wi, wh, surf.f0, surf.eta, surf.metalness );

	vec3 transmissionDirection( vec3 wo, SurfaceRecord surf ) {

		float F = schlickFresnel( dot( wi, wh ), f0 );

		float fClearcoat = F * D * G / ( 4.0 * abs( wi.z * wo.z ) );
		color = color * ( 1.0 - surf.clearcoat * F ) + fClearcoat * surf.clearcoat * wi.z;

		return ggxPDF( wo, wh, roughness ) / ( 4.0 * dot( wi, wh ) );

	// bsdf
	void getLobeWeights(
		vec3 wo, vec3 wi, vec3 wh, vec3 clearcoatWo, SurfaceRecord surf,
		inout float diffuseWeight, inout float specularWeight, inout float transmissionWeight, inout float clearcoatWeight
	) {

		float metalness = surf.metalness;
		float transmission = surf.transmission;
		// float fEstimate = evaluateFresnelWeight( dot( wo, wh ), surf.eta, surf.f0 );
		float fEstimate = disneyFresnel( wo, wi, wh, surf.f0, surf.eta, surf.metalness );

		float transSpecularProb = mix( max( 0.25, fEstimate ), 1.0, metalness );
		float diffSpecularProb = 0.5 + 0.5 * metalness;

		diffuseWeight = ( 1.0 - transmission ) * ( 1.0 - diffSpecularProb );
		specularWeight = transmission * transSpecularProb + ( 1.0 - transmission ) * diffSpecularProb;
		transmissionWeight = transmission * ( 1.0 - transSpecularProb );

		float totalWeight = diffuseWeight + specularWeight + transmissionWeight + clearcoatWeight;
		diffuseWeight /= totalWeight;
		specularWeight /= totalWeight;
		transmissionWeight /= totalWeight;
		clearcoatWeight /= totalWeight;

	float bsdfEval(
		vec3 wo, vec3 clearcoatWo, vec3 wi, vec3 clearcoatWi, SurfaceRecord surf,
		float diffuseWeight, float specularWeight, float transmissionWeight, float clearcoatWeight, inout float specularPdf, inout vec3 color

		float transmission = surf.transmission;

		float spdf = 0.0;
		float dpdf = 0.0;
		float tpdf = 0.0;
		float cpdf = 0.0;
		color = vec3( 0.0 );

		vec3 halfVector = getHalfVector( wi, wo, surf.eta );

		if ( diffuseWeight > 0.0 && wi.z > 0.0 ) {

			dpdf = diffuseEval( wo, wi, halfVector, surf, color );
			color *= 1.0 - surf.transmission;

		}

		// ggx specular
		if ( specularWeight > 0.0 && wi.z > 0.0 ) {

			vec3 outColor;
			spdf = specularEval( wo, wi, getHalfVector( wi, wo ), surf, outColor );
			color += outColor;

		}

		// transmission
		if ( transmissionWeight > 0.0 && wi.z < 0.0 ) {

			tpdf = transmissionEval( wo, wi, halfVector, surf, color );

		}

		// sheen
		color *= mix( 1.0, sheenAlbedoScaling( wo, wi, surf ), surf.sheen );
		color += sheenColor( wo, wi, halfVector, surf ) * surf.sheen;

		// clearcoat
		if ( clearcoatWi.z >= 0.0 && clearcoatWeight > 0.0 ) {

			vec3 clearcoatHalfVector = getHalfVector( clearcoatWo, clearcoatWi );
			cpdf = clearcoatEval( clearcoatWo, clearcoatWi, clearcoatHalfVector, surf, color );

		}

		float pdf =
			dpdf * diffuseWeight
			+ spdf * specularWeight
			+ tpdf * transmissionWeight
			+ cpdf * clearcoatWeight;

		// retrieve specular rays for the shadows flag
		specularPdf = spdf * specularWeight + cpdf * clearcoatWeight;

		return pdf;

	}

	float bsdfResult( vec3 worldWo, vec3 worldWi, SurfaceRecord surf, inout vec3 color ) {

		if ( surf.volumeParticle ) {

			color = surf.color / ( 4.0 * PI );

		vec3 wo = normalize( surf.normalInvBasis * worldWo );
		vec3 wi = normalize( surf.normalInvBasis * worldWi );

		vec3 clearcoatWo = normalize( surf.clearcoatInvBasis * worldWo );
		vec3 clearcoatWi = normalize( surf.clearcoatInvBasis * worldWi );

		vec3 wh = getHalfVector( wo, wi, surf.eta );

		float specularWeight;
		float transmissionWeight;
		float clearcoatWeight;
		getLobeWeights( wo, wi, wh, clearcoatWo, surf, diffuseWeight, specularWeight, transmissionWeight, clearcoatWeight );

		float specularPdf;
		return bsdfEval( wo, clearcoatWo, wi, clearcoatWi, surf, diffuseWeight, specularWeight, transmissionWeight, clearcoatWeight, specularPdf, color );

	ScatterRecord bsdfSample( vec3 worldWo, SurfaceRecord surf ) {

		if ( surf.volumeParticle ) {

			ScatterRecord sampleRec;
			sampleRec.specularPdf = 0.0;
			sampleRec.pdf = 1.0 / ( 4.0 * PI );
			sampleRec.direction = sampleSphere( rand2( 16 ) );
			sampleRec.color = surf.color / ( 4.0 * PI );
			return sampleRec;

		}

		vec3 wo = normalize( surf.normalInvBasis * worldWo );
		vec3 clearcoatWo = normalize( surf.clearcoatInvBasis * worldWo );
		mat3 normalBasis = surf.normalBasis;
		mat3 invBasis = surf.normalInvBasis;
		mat3 clearcoatNormalBasis = surf.clearcoatBasis;
		mat3 clearcoatInvBasis = surf.clearcoatInvBasis;

		float diffuseWeight;
		float specularWeight;
		float transmissionWeight;
		float clearcoatWeight;
		// using normal and basically-reflected ray since we don't have proper half vector here
		getLobeWeights( wo, wo, vec3( 0, 0, 1 ), clearcoatWo, surf, diffuseWeight, specularWeight, transmissionWeight, clearcoatWeight );

		float pdf[4];
		pdf[0] = diffuseWeight;
		pdf[1] = specularWeight;
		pdf[2] = transmissionWeight;
		pdf[3] = clearcoatWeight;

		float cdf[4];
		cdf[0] = pdf[0];
		cdf[1] = pdf[1] + cdf[0];
		cdf[2] = pdf[2] + cdf[1];
		cdf[3] = pdf[3] + cdf[2];

		if( cdf[3] != 0.0 ) {

			float invMaxCdf = 1.0 / cdf[3];
			cdf[0] *= invMaxCdf;
			cdf[1] *= invMaxCdf;
			cdf[2] *= invMaxCdf;
			cdf[3] *= invMaxCdf;

		} else {

			cdf[0] = 1.0;
			cdf[1] = 0.0;
			cdf[2] = 0.0;
			cdf[3] = 0.0;

		}

		vec3 wi;
		vec3 clearcoatWi;

		float r = rand( 15 );
		if ( r <= cdf[0] ) { // diffuse

			wi = diffuseDirection( wo, surf );
			clearcoatWi = normalize( clearcoatInvBasis * normalize( normalBasis * wi ) );

		} else if ( r <= cdf[1] ) { // specular

			wi = specularDirection( wo, surf );
			clearcoatWi = normalize( clearcoatInvBasis * normalize( normalBasis * wi ) );

		} else if ( r <= cdf[2] ) { // transmission / refraction

			wi = transmissionDirection( wo, surf );
			clearcoatWi = normalize( clearcoatInvBasis * normalize( normalBasis * wi ) );

		} else if ( r <= cdf[3] ) { // clearcoat

			clearcoatWi = clearcoatDirection( clearcoatWo, surf );
			wi = normalize( invBasis * normalize( clearcoatNormalBasis * clearcoatWi ) );

		}

		ScatterRecord result;
		result.pdf = bsdfEval( wo, clearcoatWo, wi, clearcoatWi, surf, diffuseWeight, specularWeight, transmissionWeight, clearcoatWeight, result.specularPdf, result.color );
		result.direction = normalize( surf.normalBasis * wi );

		return result;

	}

	// The GGX functions provide sampling and distribution information for normals as output so
	// in order to get probability of scatter direction the half vector must be computed and provided.
	// [0] https://www.cs.cornell.edu/~srm/publications/EGSR07-btdf.pdf
	// [1] https://hal.archives-ouvertes.fr/hal-01509746/document
	// [2] http://jcgt.org/published/0007/04/01/
	// [4] http://jcgt.org/published/0003/02/03/

	// trowbridge-reitz === GGX === GTR

	vec3 ggxDirection( vec3 incidentDir, vec2 roughness, vec2 uv ) {

		// TODO: try GGXVNDF implementation from reference [2], here. Needs to update ggxDistribution
		// function below, as well

		// Implementation from reference [1]
		// stretch view
		vec3 V = normalize( vec3( roughness * incidentDir.xy, incidentDir.z ) );

		// orthonormal basis
		vec3 T1 = ( V.z < 0.9999 ) ? normalize( cross( V, vec3( 0.0, 0.0, 1.0 ) ) ) : vec3( 1.0, 0.0, 0.0 );
		vec3 T2 = cross( T1, V );

		// sample point with polar coordinates (r, phi)
		float a = 1.0 / ( 1.0 + V.z );
		float r = sqrt( uv.x );
		float phi = ( uv.y < a ) ? uv.y / a * PI : PI + ( uv.y - a ) / ( 1.0 - a ) * PI;
		float P1 = r * cos( phi );
		float P2 = r * sin( phi ) * ( ( uv.y < a ) ? 1.0 : V.z );

		// compute normal
		vec3 N = P1 * T1 + P2 * T2 + V * sqrt( max( 0.0, 1.0 - P1 * P1 - P2 * P2 ) );

		// unstretch
		N = normalize( vec3( roughness * N.xy, max( 0.0, N.z ) ) );

		return N;

	}

	// Below are PDF and related functions for use in a Monte Carlo path tracer
	// as specified in Appendix B of the following paper
	// See equation (34) from reference [0]
	float ggxLamda( float theta, float roughness ) {

		float tanTheta = tan( theta );
		float tanTheta2 = tanTheta * tanTheta;
		float alpha2 = roughness * roughness;

		float numerator = - 1.0 + sqrt( 1.0 + alpha2 * tanTheta2 );
		return numerator / 2.0;

	}

	// See equation (34) from reference [0]
	float ggxShadowMaskG1( float theta, float roughness ) {

		return 1.0 / ( 1.0 + ggxLamda( theta, roughness ) );

	}

	// See equation (125) from reference [4]
	float ggxShadowMaskG2( vec3 wi, vec3 wo, float roughness ) {

		float incidentTheta = acos( wi.z );
		float scatterTheta = acos( wo.z );
		return 1.0 / ( 1.0 + ggxLamda( incidentTheta, roughness ) + ggxLamda( scatterTheta, roughness ) );

	}

	// See equation (33) from reference [0]
	float ggxDistribution( vec3 halfVector, float roughness ) {

		float a2 = roughness * roughness;
		a2 = max( EPSILON, a2 );
		float cosTheta = halfVector.z;
		float cosTheta4 = pow( cosTheta, 4.0 );

		if ( cosTheta == 0.0 ) return 0.0;

		float theta = acosSafe( halfVector.z );
		float tanTheta = tan( theta );
		float tanTheta2 = pow( tanTheta, 2.0 );

		float denom = PI * cosTheta4 * pow( a2 + tanTheta2, 2.0 );
		return ( a2 / denom );

	}

	// See equation (3) from reference [2]
	float ggxPDF( vec3 wi, vec3 halfVector, float roughness ) {

		float incidentTheta = acos( wi.z );
		float D = ggxDistribution( halfVector, roughness );
		float G1 = ggxShadowMaskG1( incidentTheta, roughness );

		return D * G1 * max( 0.0, dot( wi, halfVector ) ) / wi.z;

	}

	// Conversion FO/IOR
	vec3 iorToFresnel0( vec3 transmittedIor, float incidentIor ) {

	vec3 evalSensitivity( float OPD, vec3 shift ) {

		vec3 pos = vec3( 1.6810e+06, 1.7953e+06, 2.2084e+06 );

		vec3 xyz = val * sqrt( 2.0 * PI * var ) * cos( pos * phase + shift ) * exp( - square( phase ) * var );

		vec3 I;

		// Force iridescenceIor -> outsideIOR when thinFilmThickness -> 0.0
		float iridescenceIor = mix( outsideIOR, eta2, smoothstep( 0.0, 0.03, thinFilmThickness ) );

		// Evaluate the cosTheta on the base layer (Snell law)
		float sinTheta2Sq = square( outsideIOR / iridescenceIor ) * ( 1.0 - square( cosTheta1 ) );

		// Handle TIR:
		float cosTheta2Sq = 1.0 - sinTheta2Sq;
		if ( cosTheta2Sq < 0.0 ) {

			return vec3( 1.0 );

		}

		float cosTheta2 = sqrt( cosTheta2Sq );

		// First interface
		float R0 = iorToFresnel0( iridescenceIor, outsideIOR );
		float R12 = schlickFresnel( cosTheta1, R0 );
		float R21 = R12;
		float T121 = 1.0 - R12;
		float phi12 = 0.0;
		if ( iridescenceIor < outsideIOR ) {

			phi12 = PI;

		float phi21 = PI - phi12;

		// Second interface
		vec3 baseIOR = fresnel0ToIor( clamp( baseF0, 0.0, 0.9999 ) ); // guard against 1.0
		vec3 R1 = iorToFresnel0( baseIOR, iridescenceIor );

		vec3 phi23 = vec3( 0.0 );
		if ( baseIOR[0] < iridescenceIor ) {

			phi23[ 0 ] = PI;

		}

		if ( baseIOR[1] < iridescenceIor ) {

			phi23[ 1 ] = PI;

		}

		if ( baseIOR[2] < iridescenceIor ) {

			phi23[ 2 ] = PI;

		// Phase shift
		float OPD = 2.0 * iridescenceIor * thinFilmThickness * cosTheta2;
		vec3 phi = vec3( phi21 ) + phi23;

		// Compound terms
		vec3 R123 = clamp( R12 * R23, 1e-5, 0.9999 );
		vec3 r123 = sqrt( R123 );

		vec3 C0 = R12 + Rs;

	// See equation (2) in http://www.aconty.com/pdf/s2017_pbs_imageworks_sheen.pdf
	float velvetD( float cosThetaH, float roughness ) {

		float alpha = max( roughness, 0.07 );
		alpha = alpha * alpha;

		float invAlpha = 1.0 / alpha;

		float sqrCosThetaH = cosThetaH * cosThetaH;
		float sinThetaH = max( 1.0 - sqrCosThetaH, 0.001 );

	float velvetParamsInterpolate( int i, float oneMinusAlphaSquared ) {

		const float p0[5] = float[5]( 25.3245, 3.32435, 0.16801, -1.27393, -4.85967 );
		const float p1[5] = float[5]( 21.5473, 3.82987, 0.19823, -1.97760, -4.32054 );

		return mix( p1[i], p0[i], oneMinusAlphaSquared );

	float velvetL( float x, float alpha ) {

		float oneMinusAlpha = 1.0 - alpha;
		float oneMinusAlphaSquared = oneMinusAlpha * oneMinusAlpha;

		float a = velvetParamsInterpolate( 0, oneMinusAlphaSquared );
		float b = velvetParamsInterpolate( 1, oneMinusAlphaSquared );
		float c = velvetParamsInterpolate( 2, oneMinusAlphaSquared );
		float d = velvetParamsInterpolate( 3, oneMinusAlphaSquared );
		float e = velvetParamsInterpolate( 4, oneMinusAlphaSquared );

		return a / ( 1.0 + b * pow( abs( x ), c ) ) + d * x + e;

	// See equation (3) in http://www.aconty.com/pdf/s2017_pbs_imageworks_sheen.pdf
	float velvetLambda( float cosTheta, float alpha ) {

		return abs( cosTheta ) < 0.5 ? exp( velvetL( cosTheta, alpha ) ) : exp( 2.0 * velvetL( 0.5, alpha ) - velvetL( 1.0 - cosTheta, alpha ) );

	float directionalAlbedoSheen( float cosTheta, float alpha ) {
